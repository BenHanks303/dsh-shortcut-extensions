name: Release

# Publishes to npm with Trusted Publishing (OIDC): no npm token, no local 2FA.
# Configure the matching trusted publisher on npmjs.com:
#   package Settings -> Trusted publishing -> GitHub Actions
#   repository: BenHanks303/dsh-shortcut-extensions
#   workflow filename: release.yml
#   environment: (leave empty)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@11

      - name: Check
        run: npm run check

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          node -e "const p=require('./package.json');const t=process.env.GITHUB_REF_NAME.replace(/^v/,'');if(p.version!==t){console.error('tag '+t+' != package.json '+p.version);process.exit(1)}"

      - name: Publish to npm (OIDC, no token)
        run: npm publish
